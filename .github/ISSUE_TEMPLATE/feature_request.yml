name: Feature Request
description: Suggest an enhancement or new security rule for GuardMCP
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve GuardMCP!
  - type: textarea
    id: problem
    attributes:
      label: Is your request related to an MCP server vulnerability or AI client security risk?
      description: Explain the security threat or tool exposure.
      placeholder: When configuring MCP tools with shell execution permissions...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the proposed security rule or feature
      description: How should GuardMCP detect and flag this risk?
    validations:
      required: true

